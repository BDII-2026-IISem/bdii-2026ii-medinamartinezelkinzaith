
<header class="fixed inset-x-0 top-0 z-50 w-full border-b border-white/10 bg-[#0A0F1B] text-white shadow-xl">
  <div class="flex w-full flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-8 lg:px-12">

    <!-- Marca -->
    <a routerLink="/clients" class="flex shrink-0 items-center gap-3 no-underline">
    <div class="flex items-center gap-2.5">
    <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-lime-300 text-slate-950 shadow-lg shadow-lime-300/10">
        <i class="pi pi-bolt text-lg"></i>
    </div>

    <div>
        <h1 class="text-xl font-black tracking-tight sm:text-2xl">
        Activa<span class="text-lime-300">Fit</span>
        </h1>
        <p class="text-[9px] font-bold uppercase tracking-[0.15em] text-slate-400">
        Fitness Management
        </p>
    </div>
    </div>

    </a>

    <!-- Acciones -->
    <div class="flex shrink-0 items-center gap-3">
      <button type="button"
              aria-label="Notificaciones"
              class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/10 bg-white/5 transition hover:bg-white/10">
        <i class="pi pi-bell text-lg"></i>
      </button>

      
        <a
        [routerLink]="routerLink"
        class="flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 text-white no-underline transition hover:bg-white/10"
        >
        <i class="pi pi-user text-lime-300"></i>
        <span class="hidden text-sm font-semibold sm:inline">Mi cuenta</span>
        <i class="pi pi-angle-down text-xs text-slate-400"></i>
        </a>

    </div>

  </div>
</header>
