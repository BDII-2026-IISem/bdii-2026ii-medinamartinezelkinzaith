<app-page-header title="Planes" subtitle="La baja es lógica: el plan queda inactivo y sale de este listado.">
  <p-tag [value]="rows().length + ' activos'" severity="info" [rounded]="true" />
  <ng-container *appHasPermission="'POST /api/plans'"><button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo plan</span>
  </button></ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<p-table
  [value]="visibleRows()"
  [loading]="loading()"
  dataKey="id"
  tableStyleClass="min-w-2xl"
  [paginator]="visibleRows().length > 10"
  [rows]="10"
>
  <ng-template #caption>
    <input
      pInputText
      type="search"
      class="w-full"
      aria-label="Buscar planes"
      placeholder="Buscar por nombre o descripción…"
      [value]="filter()"
      (input)="filter.set($any($event.target).value)"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Nombre <p-sort-icon field="name" /></th>
      <th>Descripción</th>
      <th>Estado</th>
      <th class="w-32 text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-plan>
    <tr>
      <td>
        <p class="font-medium text-slate-800">{{ plan.name }}</p>
        <p class="text-xs text-slate-400">#{{ plan.id }}</p>
      </td>
      <td class="text-sm text-slate-600">{{ plan.description || '—' }}</td>
      <td><app-status-tag [status]="plan.status" /></td>
      <td class="text-right">
        <ng-container *appHasPermission="'PATCH /api/plans/:id'"><button
          pButton
          type="button"
          text
          rounded
          severity="secondary"
          aria-label="Editar plan"
          pTooltip="Editar"
          (click)="openEdit(plan)"
        ><i pButtonIcon class="pi pi-pencil"></i></button></ng-container>
        <ng-container *appHasPermission="'DELETE /api/plans/:id'"><button
          pButton
          type="button"
          text
          rounded
          severity="danger"
          aria-label="Desactivar plan"
          pTooltip="Desactivar"
          (click)="deactivate(plan)"
        ><i pButtonIcon class="pi pi-trash"></i></button></ng-container>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        @if (filter()) {
          <app-empty-state
            icon="pi pi-search"
            title="Sin coincidencias"
            message="Ningún plan coincide. Borra el filtro para ver todos."
          />
        } @else {
          <app-empty-state
            icon="pi pi-tags"
            title="Sin planes"
            message="Crea el primero con «Nuevo plan»."
          />
        }
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editing() ? 'Editar plan' : 'Nuevo plan'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-lg mx-4"
>
  <app-plan-form
    [plan]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
