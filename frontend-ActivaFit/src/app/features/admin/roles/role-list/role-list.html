<app-page-header
  title="Roles"
  subtitle="Agrupan concesiones. Un rol sin concesiones activas no autoriza nada."
>
  <p-tag [value]="rows().length + ' roles'" severity="info" [rounded]="true" />
  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo rol</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<p-table
  [value]="visibleRows()"
  [loading]="loading()"
  dataKey="id"
  tableStyleClass="min-w-2xl"
  [paginator]="visibleRows().length > 10"
  [rows]="10"
>
  <ng-template #caption>
    <input
      pInputText
      type="search"
      class="w-full"
      aria-label="Buscar roles"
      placeholder="Buscar por nombre o descripción…"
      [value]="filter()"
      (input)="filter.set($any($event.target).value)"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Rol <p-sort-icon field="name" /></th>
      <th>Descripción</th>
      <th>Estado</th>
      <th class="w-32 text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-row>
    <tr>
      <td>
        <p class="font-medium text-slate-800">{{ row.name }}</p>
        <p class="text-xs text-slate-400">#{{ row.id }}</p>
      </td>
      <td class="text-sm text-slate-600">{{ row.description || '—' }}</td>
      <td><app-status-tag [status]="row.status" /></td>
      <td class="text-right">
        <button pButton type="button" text rounded severity="secondary" aria-label="Editar rol" pTooltip="Editar" (click)="openEdit(row)"><i pButtonIcon class="pi pi-pencil"></i></button>
        <button pButton type="button" text rounded severity="danger" aria-label="Desactivar rol" pTooltip="Desactivar" [disabled]="row.status === 'inactive'" (click)="deactivate(row)"><i pButtonIcon class="pi pi-trash"></i></button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        <app-empty-state icon="pi pi-id-card" title="Sin roles" message="Crea el primero con «Nuevo rol»." />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editing() ? 'Editar rol' : 'Nuevo rol'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-lg mx-4"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4">
    <div class="flex flex-col gap-2">
      <label for="role-name">Nombre <span class="text-red-500">*</span></label>
      <input id="role-name" pInputText formControlName="name" class="w-full" placeholder="consulta" autocomplete="off" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <p-message severity="error" size="small" variant="simple">Entre 2 y 100 caracteres.</p-message>
      }
    </div>
    <div class="flex flex-col gap-2">
      <label for="role-description">Descripción</label>
      <input id="role-description" pInputText formControlName="description" class="w-full" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="role-status">Estado</label>
      <p-select inputId="role-status" formControlName="status" [options]="statusOptions" optionLabel="label" optionValue="value" [fluid]="true" appendTo="body" />
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
      <button pButton type="button" severity="secondary" outlined (click)="dialogVisible.set(false)"><span pButtonLabel>Cancelar</span></button>
      <button pButton type="submit" [loading]="saving()"><span pButtonLabel>Guardar</span></button>
    </div>
  </form>
</p-dialog>
